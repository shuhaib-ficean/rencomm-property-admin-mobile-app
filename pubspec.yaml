name: admin_mobile_app
description: Admin mobile app for Rencomm Smart Rental Management System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  retrofit: 4.9.1
  json_annotation: ^4.8.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.20.3
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  fl_chart: ^1.1.1
  google_fonts: ^6.2.1
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  fpdart: ^1.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  http_parser: ^4.1.2
  excel: ^4.0.6
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo_square.png"
  min_sdk_android: 21
